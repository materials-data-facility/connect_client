[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdf_agent"
version = "0.2.0"
description = "Modern MDF Connect client with CLI, Python API, and Claude skill integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Materials Data Facility" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]

dependencies = [
  "pydantic>=2.0",
  "globus-sdk>=3.0",
  "typer[all]>=0.9.0",
  "rich>=13.0",
  "pyyaml>=6.0",
  "httpx>=0.24.0",
  "nameparser>=1.1.0",
]

[project.optional-dependencies]
extractors = [
  "pypdf>=3.0",
  "pandas>=2.0",
  "openpyxl>=3.1",
]

[project.scripts]
mdf = "mdf_agent.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
